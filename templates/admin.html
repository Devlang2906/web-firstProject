<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Unpas Trade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 40px 20px; }
        h1 { font-size: 1.5em; font-weight: 800; color: #1e293b; margin-bottom: 24px; }
        table { width: 100%; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-collapse: collapse; overflow: hidden; }
        th { background: linear-gradient(135deg, #1e40af, #2563eb); color: white; padding: 14px 20px; text-align: left; font-size: 0.85em; }
        td { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; font-size: 0.9em; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
    </style>
</head>
<body>
    <h1>👤 Data User Terdaftar</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>NIM</th>
                <th>Nama</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.nim }}</td>
                <td>{{ user.nama }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align:center; color:#aaa;">Belum ada user terdaftar</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
